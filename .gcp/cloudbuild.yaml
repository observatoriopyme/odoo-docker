availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/MAXMIND_ACCOUNT_ID/versions/latest
      env: MAXMIND_ACCOUNT_ID
    - versionName: projects/$PROJECT_ID/secrets/MAXMIND_LICENSE_KEY/versions/latest
      env: MAXMIND_LICENSE_KEY

steps:
  - name: gcr.io/cloud-builders/docker
    secretEnv:
      - MAXMIND_ACCOUNT_ID
      - MAXMIND_LICENSE_KEY
    args:
      - build
      - '--no-cache'
      - '--build-arg'
      - 'MAXMIND_ACCOUNT_ID=$$MAXMIND_ACCOUNT_ID'
      - '--build-arg'
      - 'MAXMIND_LICENSE_KEY=$$MAXMIND_LICENSE_KEY'
      - '-t'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME-$_ODOO_VERSION:$COMMIT_SHA
      - '-t'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME-$_ODOO_VERSION:latest
      - ./$_ODOO_VERSION
      - '-f'
      - ./$_ODOO_VERSION/Dockerfile
    id: Build
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - '-a'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME-$_ODOO_VERSION
    id: Push images
images:
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME-$_ODOO_VERSION:$COMMIT_SHA
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME-$_ODOO_VERSION:latest
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _AR_HOSTNAME: us-east4-docker.pkg.dev
  _PLATFORM: managed
  _SERVICE_NAME: odoo
  _DEPLOY_REGION: us-east4
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - odoo